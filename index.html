<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Important ❤️</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 20%,#fff0f6,#ffc8dc 55%,#ed8fb5);color:#3b1828;overflow:hidden}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(700px,94vw);padding:38px 25px;border-radius:30px;background:#ffffffe8;box-shadow:0 25px 70px #6d173733;text-align:center;backdrop-filter:blur(12px)}h1{font-size:clamp(35px,7vw,58px);margin:8px 0}h2{font-size:32px}.heart{font-size:68px;animation:p 1.1s infinite}@keyframes p{50%{transform:scale(1.12)}}button{border:0;border-radius:999px;padding:15px 25px;font-size:17px;font-weight:700;cursor:pointer}.yes,.next{background:#e92f70;color:white}.no{background:white;color:#a22a51;border:2px solid #f0a3bd}.buttons{height:130px;position:relative;display:flex;justify-content:center;gap:18px;align-items:center}.no{position:relative}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.opt{background:#fff;border:2px solid transparent;border-radius:18px;padding:18px}.opt.sel{border-color:#e92f70;background:#ffe1ec}.hidden{display:none}.date{width:100%;padding:15px;border:2px solid #efa4be;border-radius:15px;font-size:18px;margin:15px 0}.summary{background:#fff1f7;border-radius:20px;padding:20px;margin:20px 0}.small{opacity:.6;font-size:13px}.error{color:#b21e50;margin-top:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><main class="card"><section id="s1"><div class="heart">❤️</div><h1>Will you go out with me?</h1><p>Çok önemli bir sorum var...</p><div class="buttons" id="ba"><button class="yes" onclick="show(2)">YES ❤️</button><button class="no" id="no">NO 🥺</button></div></section><section id="s2" class="hidden"><div class="heart">🥰</div><h2>Yessss! ❤️</h2><p>Peki, nereye gidelim?</p><div class="grid"><button class="opt" onclick="place(this,'Kanlı Kavak')">🌳 Kanlı Kavak</button><button class="opt" onclick="place(this,'Charlies Pub')">🍻 Charlies Pub</button><button class="opt" onclick="place(this,'Sinema')">🎬 Sinema</button><button class="opt" onclick="place(this,'Club')">🪩 Club</button><button class="opt" onclick="place(this,'Social')">🎮 Social</button><button class="opt" onclick="place(this,'Evde Film Gecesi')">🍿 Evde Film Gecesi</button><button class="opt" onclick="place(this,'Yürüyüş')">🚶 Yürüyüş</button></div><button id="pn" class="next hidden" onclick="show(3)">Devam et ❤️</button></section><section id="s3" class="hidden"><div class="heart">📅</div><h2>Ne zaman?</h2><p>Bir tarih seç ❤️</p><input class="date" id="date" type="date"><br><button id="finish" class="next" onclick="showFinal()">Tamamla ❤️</button><div id="err" class="error"></div></section><section id="s4" class="hidden"><div class="heart">💞</div><h2>Harika! Planımız belli.</h2><div class="summary"><b>📍 Mekan</b><div id="fp"></div><br><b>📅 Tarih</b><div id="fd"></div></div><p>Görüşürüz ❤️</p><p class="small">Date confirmed ✨</p></section></main></div><script>const SUPABASE_URL="https://xlavvivsujbdhccruyjv.supabase.co";const SUPABASE_KEY="sb_publishable_4BdM_P_5nBIwVhbQTgmOmA_MXxB8lXW";let selected="";function show(n){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById("s"+n).classList.remove("hidden")}function place(b,p){document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");selected=p;document.getElementById("pn").classList.remove("hidden")}const no=document.getElementById("no");function run(){const a=document.getElementById("ba").getBoundingClientRect(),b=no.getBoundingClientRect();no.style.position="absolute";no.style.left=Math.max(0,Math.random()*(a.width-b.width))+"px";no.style.top=Math.max(0,Math.random()*(a.height-b.height))+"px"}no.addEventListener("mouseenter",run);no.addEventListener("touchstart",e=>{e.preventDefault();run()});no.addEventListener("click",run);async function saveResponse(place,date){const r=await fetch(SUPABASE_URL+"/rest/v1/responses",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({place,date})});if(!r.ok)throw new Error(await r.text())}async function showFinal(){const v=document.getElementById("date").value,err=document.getElementById("err"),finish=document.getElementById("finish");err.textContent="";if(!selected||!v){err.textContent="Mekan ve tarih seçmelisin ❤️";return}finish.disabled=true;finish.textContent="Kaydediliyor... ❤️";try{await saveResponse(selected,v);document.getElementById("fp").textContent=selected;document.getElementById("fd").textContent=new Date(v+"T00:00:00").toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});show(4)}catch(e){console.error(e);err.textContent="Bir şey ters gitti. Lütfen tekrar dene.";finish.disabled=false;finish.textContent="Tamamla ❤️"}}</script></body></html>
